# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Transaction Management
spring.jpa.properties.hibernate.transaction.coordinator_class=jdbc

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationInBankingSystem2024
jwt.expiration=86400000

# Application Configuration
spring.application.name=Online Banking System

